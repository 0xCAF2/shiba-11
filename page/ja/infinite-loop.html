  <body>
    <h1>「無限ループ」すると、フリーズの原因になる</h1>
    <p>
      条件が常に満たされるループを使うと、無限に繰り返すことになります。無限ループは意図的に使われることもありますが、誤って作成するとプログラムが停止しなくなる原因となります。
    </p>
    <p>
      ループの条件は常に「真」であっても、ループの中に「〜になったら、繰り返しを終了する」という命令を書くことができます。
    </p>
    <p>
      また、コンピュータは自分が無限ループしているのかどうか、判断することができません。そのため、無限ループを避けるためには、ループの終了条件を適切に設定することが重要です。
    </p>
  </body>
