  <body>
    <h1>繰り返し（ループ）</h1>
    <p>同じ処理を何度も繰り返す必要がある場面では、ループを使うと便利です。</p>
    <p>
      プログラミングにおけるループは、いくつかの種類が用意されていることが多いですが、基本的には以下のように分けられます。
    </p>
    <ul>
      <li>N 回だけ、繰り返す</li>
      <li>条件を満たす間、繰り返す</li>
      <li>リストや配列から、要素を順番に取り出しながら、繰り返す</li>
    </ul>
  </body>
