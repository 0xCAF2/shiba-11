    <title>記憶する（計算する） | しば | プログラミング</title>
    <link rel="stylesheet" href="../index.css" />
  </head>
  <body>
    <h1>コンピュータは「記憶する」「計算する」のが得意</h1>
    <p>
      プログラミングでは、計算結果を記憶しておいて後から使うための命令があります。
    </p>
    <p>
      「変数を使う」という言い方もします。変数というと数学の用語ですが、ここではシンプルに<strong>「データに名前をつける」</strong>ことだと考えてください。
    </p>
    <p>
      例えば、買い物をするとき、あめ玉1個の値段が 50
      円だとすると、プログラミング的には
      <code>candy = 50</code> のような書き方をします。そして 3
      つ買ったとき、商品の合計を計算するためには
      <code>total = candy * 3</code>
      とします。
    </p>
  </body>
</html>
