<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="条件や場合によって、プログラムの流れを変える方法を学びます。"
    />
    <link rel="icon" href="../favicon.png" />
    <title>場合分け（条件分岐） | しば | プログラミング</title>
    <link rel="stylesheet" href="../index.css" />
  </head>
  <body>
    <h1>プログラミングは「もし〜なら」の条件だらけ</h1>
    <p>
      ある条件の時だけ、あるいは場合分けして、プログラムの動きを変えたい時があります。例えば、
    </p>
    <p>
      <code
        >もし 人数 > 0 なら：<br />&nbsp;&nbsp;一人当たりの支払い = 合計金額 /
        人数</code
      >
    </p>
    <p>あるいは、いくつかの場合に分かれているとき、</p>
    <p>
      <code
        >もし 天気 == 晴れ なら：<br />&nbsp;&nbsp;散歩に行く<br />そうでなくて、もし
        天気 == 雨 なら：<br />&nbsp;&nbsp;家で読書をする</code
      >
    </p>
    <p>
      このようにプログラミングには、条件を満たすときに処理を行う仕組みがあります。これを<strong>場合分け</strong>（あるいは条件分岐）といいます。
    </p>
  </body>
</html>
