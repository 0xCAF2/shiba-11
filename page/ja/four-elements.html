    <h1>プログラミングの 4 要素</h1>
    <p>プログラミングで使うのは、基本的に 4 つの要素だけです。</p>
    <ul>
      <li>覚える（計算する）</li>
      <li>場合分け</li>
      <li>繰り返す</li>
      <li>呼び出す（機能を使う）</li>
