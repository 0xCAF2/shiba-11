    <h1>Memorise (Calculate)</h1>
    <p>
      In programming, you often need to memorise values and perform
      calculations.
    </p>
    <p>For example, if a candy costs 50 units, you can memorise it as:</p>
    <code>candy = 50</code>
    <p>Then, if you buy 3 candies, you can calculate the total as:</p>
    <code>total = candy * 3</code>
